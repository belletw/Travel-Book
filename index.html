<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>世界漫遊 | All Trips Portal</title>
  <!-- 引入 Google Fonts: Huninn (粉圓體) 與備援圓體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Huninn&display=swap');

    :root {
      --bg-washi: #FFFCF6;
      --ink-gray: #3E3A39;
      --coral-pink: #F2A497;
      --yamabuki-yellow: #F6D27A;
      --mizu-blue: #A8D3E6;
      --wakatake-green: #B9DAA5;
      --card-white: #FFFFFF;
      --muted-beige: #F4EFE6;
      --border-thick: 3px solid #3E3A39;
      --shadow-hard: 4px 4px 0px #3E3A39;
      --shadow-hard-sm: 2px 2px 0px #3E3A39;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-washi);
      color: var(--ink-gray);
      font-family: 'Huninn', 'jf-openhuninn', 'Zen Maru Gothic', 'PingFang TC', 'Heiti TC', sans-serif;
      line-height: 1.6;
      padding-top: 76px;
      padding-bottom: 60px;
      overflow-x: hidden;
      background-image: radial-gradient(#E8E0D2 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }

    /* 頂端固定導覽列 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background-color: var(--bg-washi);
      border-bottom: var(--border-thick);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      color: var(--ink-gray);
      flex-shrink: 0;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background-color: var(--yamabuki-yellow);
      border: var(--border-thick);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-hard-sm);
      font-size: 20px;
    }

    .brand-text-wrap {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      font-size: 0.72rem;
      font-weight: 700;
      opacity: 0.75;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-actions::-webkit-scrollbar { display: none; }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      border: var(--border-thick);
      background-color: var(--card-white);
      color: var(--ink-gray);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: var(--shadow-hard-sm);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      text-decoration: none;
    }

    .btn-pill:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--ink-gray);
    }

    .btn-pill:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--ink-gray);
    }

    .btn-coral { background-color: var(--coral-pink); }
    .btn-yellow { background-color: var(--yamabuki-yellow); }
    .btn-blue { background-color: var(--mizu-blue); }
    .btn-green { background-color: var(--wakatake-green); }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* 首頁 Hero 區塊 */
    .hero-card {
      background-color: var(--card-white);
      border: var(--border-thick);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-hard);
      padding: 22px 20px;
      margin-top: 16px;
      margin-bottom: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero-badge {
      display: inline-block;
      background-color: var(--yamabuki-yellow);
      border: 2.5px solid var(--ink-gray);
      border-radius: var(--radius-pill);
      padding: 4px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 12px;
      box-shadow: var(--shadow-hard-sm);
    }

    .hero-title {
      font-size: 1.55rem;
      font-weight: 900;
      margin-bottom: 8px;
      line-height: 1.35;
    }

    .hero-desc {
      font-size: 0.92rem;
      max-width: 540px;
      margin: 0 auto 16px;
      opacity: 0.9;
    }

    .hero-svg-wrap {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 16px;
      background-color: var(--bg-washi);
      border: var(--border-thick);
      border-radius: var(--radius-md);
      padding: 10px;
    }

    /* 統計小面板 */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .stat-box {
      padding: 10px 8px;
      border: 2.5px solid var(--ink-gray);
      border-radius: var(--radius-md);
      background-color: var(--bg-washi);
      box-shadow: var(--shadow-hard-sm);
    }

    .stat-num {
      font-size: 1.35rem;
      font-weight: 900;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 0.76rem;
      font-weight: 700;
      margin-top: 2px;
    }

    /* 區塊標題與篩選列 */
    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
      padding: 9px 14px;
      border: var(--border-thick);
      border-radius: var(--radius-pill);
      background-color: var(--card-white);
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--ink-gray);
      box-shadow: var(--shadow-hard-sm);
      outline: none;
    }

    .filter-btn {
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      border: 2.5px solid var(--ink-gray);
      background-color: var(--card-white);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-hard-sm);
    }

    .filter-btn.active {
      background-color: var(--ink-gray);
      color: var(--bg-washi);
    }

    /* 行程卡片列表 */
    .trip-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      margin-bottom: 28px;
    }

    @media (min-width: 600px) {
      .trip-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .trip-card {
      background-color: var(--card-white);
      border: var(--border-thick);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-hard);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
